name: portable-tests

on:
  pull_request:
  push:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install portable dependencies
        run: python -m pip install numpy pillow pyyaml pytest scipy
      - name: Run portable tests
        run: python -m pytest -q
